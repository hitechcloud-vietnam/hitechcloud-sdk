[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitechcloud-sdk"
version = "1.0.0"
description = "Official HiTechCloud UserAPI SDK for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "HiTechCloud", email = "support@hitechcloud.vn"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.8.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "responses>=0.23"]

[project.urls]
Homepage = "https://github.com/hitechcloud-vietnam/hitechcloud-sdk"
Documentation = "https://docs.hitechcloud.vn"
Repository = "https://github.com/hitechcloud-vietnam/hitechcloud-sdk"
Issues = "https://github.com/hitechcloud-vietnam/hitechcloud-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hitechcloud*"]
